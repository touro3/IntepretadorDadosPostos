<!DOCTYPE html>
<html lang="en">
<head>

  <title>Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>

  <div class="container">
    <div class="sidebar">

    </div>
  </div>

  <script src="script.js"></script>

</html>
